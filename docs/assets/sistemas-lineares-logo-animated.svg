<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="sl-alogo-title sl-alogo-desc">
<title id="sl-alogo-title">Sistemas Lineares</title>
<desc id="sl-alogo-desc">O ícone de Sistemas Lineares, uma matriz entre colchetes, desenhando-se traço a traço, com os pontos surgindo em sequência e um brilho lilás que respira.</desc>
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:title>Sistemas Lineares — logo animado</dc:title><dc:description>O ícone de Sistemas Lineares, uma matriz entre colchetes, desenhando-se traço a traço, com os pontos surgindo em sequência e um brilho lilás que respira.</dc:description><dc:creator><cc:Agent><dc:title>Lucas Lima (Zywl)</dc:title></cc:Agent></dc:creator><dc:publisher><cc:Agent><dc:title>Lucas Lima (Zywl)</dc:title></cc:Agent></dc:publisher><dc:rights><cc:Agent><dc:title>Copyright © 2026 Lucas Lima (Zywl)</dc:title></cc:Agent></dc:rights><dc:source>https://github.com/opZywl/sistemas-lineares</dc:source><dc:relation>https://lucas-lima.xyz</dc:relation><dc:date>2026</dc:date><dc:format>image/svg+xml</dc:format><dc:language>pt-BR</dc:language></cc:Work></rdf:RDF></metadata>
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1a20"/><stop offset=".55" stop-color="#111010"/><stop offset="1" stop-color="#0b0a0b"/></linearGradient>
<radialGradient id="aura" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="128"><stop offset="0" stop-color="#CEA9F3" stop-opacity=".26"/><stop offset=".5" stop-color="#8f6db3" stop-opacity=".08"/><stop offset="1" stop-color="#111010" stop-opacity="0"/></radialGradient>
<radialGradient id="grid-fade" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="150"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
<mask id="grid-mask"><rect width="256" height="256" fill="url(#grid-fade)"/></mask>
<clipPath id="tile-clip"><rect width="256" height="256" rx="56"/></clipPath>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<style>.tile{transform-box:view-box;transform-origin:128px 128px;animation:tile .7s cubic-bezier(.2,1,.3,1) both}
@keyframes tile{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.aura{transform-box:view-box;transform-origin:128px 128px;animation:aura-in 1.2s ease-out both,breathe 3.5s 1.2s ease-in-out infinite alternate}
@keyframes aura-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes breathe{from{opacity:1;transform:none}to{opacity:.7;transform:scale(1.08)}}
.draw{fill:none;stroke:#CEA9F3;stroke-width:12.38;stroke-linecap:round;stroke-linejoin:round;animation:draw 1s cubic-bezier(.65,0,.35,1) .25s both}
@keyframes draw{0%{stroke-dasharray:197;stroke-dashoffset:197;opacity:0}5%{opacity:1}100%{stroke-dasharray:197;stroke-dashoffset:0;opacity:1}}
.dot{fill:#CEA9F3;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,1.5,.4,1) var(--d) both,var(--w) 7s cubic-bezier(.4,0,.2,1) 0s infinite}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
.glow{opacity:.5;animation:glow 3.5s 1.4s ease-in-out infinite alternate both}
@keyframes glow{from{opacity:.5}to{opacity:.9}}
.float{animation:float 3.5s ease-in-out infinite alternate both}
@keyframes float{from{transform:translateY(-2px)}to{transform:translateY(2px)}}
@keyframes w0{0%,17.143%,31.429%,100%{fill:#CEA9F3}22.143%{fill:#EEE2FC}}
@keyframes w1{0%,18.286%,32.571%,100%{fill:#CEA9F3}23.286%{fill:#EEE2FC}}
@keyframes w2{0%,21.714%,36%,100%{fill:#CEA9F3}26.714%{fill:#EEE2FC}}
@keyframes w3{0%,22.857%,37.143%,100%{fill:#CEA9F3}27.857%{fill:#EEE2FC}}
@keyframes w4{0%,26.286%,40.571%,100%{fill:#CEA9F3}31.286%{fill:#EEE2FC}}
@keyframes w5{0%,27.429%,41.714%,100%{fill:#CEA9F3}32.429%{fill:#EEE2FC}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.glow{opacity:.6}}</style>
<g class="tile">
<g clip-path="url(#tile-clip)">
<rect width="256" height="256" fill="url(#tile)"/>
<rect width="256" height="256" fill="url(#grid)" mask="url(#grid-mask)"/>
<circle class="aura" cx="128" cy="128" r="128" fill="url(#aura)"/>
<g class="float">
<g class="glow" filter="url(#glow)"><path class="draw" d="M90.5 60.5L60.5 60.5L60.5 195.5L90.5 195.5"/><path class="draw" d="M165.5 60.5L195.5 60.5L195.5 195.5L165.5 195.5"/><rect class="dot" style="--d:1s;--w:none" x="99.31" y="91.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.09s;--w:none" x="136.81" y="91.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.18s;--w:none" x="99.31" y="121.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.27s;--w:none" x="136.81" y="121.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.36s;--w:none" x="99.31" y="151.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.45s;--w:none" x="136.81" y="151.81" width="19.88" height="12.38" rx="6.19"/></g>
<path class="draw" d="M90.5 60.5L60.5 60.5L60.5 195.5L90.5 195.5"/><path class="draw" d="M165.5 60.5L195.5 60.5L195.5 195.5L165.5 195.5"/><rect class="dot" style="--d:1s;--w:w0" x="99.31" y="91.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.09s;--w:w1" x="136.81" y="91.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.18s;--w:w2" x="99.31" y="121.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.27s;--w:w3" x="136.81" y="121.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.36s;--w:w4" x="99.31" y="151.81" width="19.88" height="12.38" rx="6.19"/><rect class="dot" style="--d:1.45s;--w:w5" x="136.81" y="151.81" width="19.88" height="12.38" rx="6.19"/>
</g>
</g>
<rect x=".5" y=".5" width="255" height="255" rx="55.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</g>
</svg>
