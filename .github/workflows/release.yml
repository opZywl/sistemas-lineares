name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Testar e compilar no Windows
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Conferir a versão e o CHANGELOG
        shell: pwsh
        run: ./.github/scripts/notas-da-release.ps1 -Versao $env:TAG -Saida "$env:RUNNER_TEMP/notas.md"

      - name: Ler a toolchain fixada
        id: toolchain
        shell: pwsh
        run: ./.github/scripts/toolchain.ps1

      - name: Instalar o Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.canal }}
          components: rustfmt, clippy

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: release

      - name: Instalar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Conferir o compilador C# do .NET Framework
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) {
            throw "csc.exe não encontrado em ${csc}: a paridade com a versão C# não seria verificada."
          }
          Write-Output "Compilador C#: $csc"

      - name: Conferir o Cargo.lock
        working-directory: native
        run: cargo fetch --locked

      - name: Testes, paridade e versão HTML
        shell: cmd
        run: call .\testar-tudo.cmd --no-pause

      - name: Conferir o HTML commitado
        shell: pwsh
        run: |
          git diff --quiet -- SistemasLineares.html
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error file=SistemasLineares.html::O SistemasLineares.html da tag está diferente do gerado a partir de portable/ e assets/.'
            exit 1
          }

      - name: Compilar o SistemasLineares.exe
        working-directory: native
        run: cargo build --release --locked

      - name: Separar os arquivos do Windows e do navegador
        shell: pwsh
        run: ./.github/scripts/sha256.ps1 -Destino dist -Executavel native/target/release/SistemasLineares.exe -Html SistemasLineares.html

      - name: Enviar os arquivos
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/SistemasLineares-Windows.exe
            dist/SistemasLineares-Navegador.html
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Testar e compilar no Linux
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Ler a toolchain fixada
        id: toolchain
        shell: pwsh
        run: ./.github/scripts/toolchain.ps1

      - name: Instalar o Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.canal }}

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: linux

      - name: Instalar o Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Conferir o Cargo.lock
        working-directory: native
        run: cargo fetch --locked

      - name: Testes do núcleo, do modelo e do app Linux
        working-directory: native
        run: xvfb-run -a cargo test --release --locked -p sistemas-lineares-core -p sistemas-lineares-ui -p sistemas-lineares-linux

      - name: Compilar o sistemas-lineares
        working-directory: native
        run: cargo build --release --locked -p sistemas-lineares-linux

      - name: Separar o binário do Linux
        run: |
          mkdir -p dist
          cp native/target/release/sistemas-lineares dist/SistemasLineares-Linux
          sha256sum dist/SistemasLineares-Linux

      - name: Enviar o binário
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/SistemasLineares-Linux
          if-no-files-found: error
          retention-days: 1

  publicar:
    name: Publicar a release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Juntar os arquivos
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Calcular o SHA-256
        shell: pwsh
        run: ./.github/scripts/sha256.ps1 -Destino dist

      - name: Montar as notas da release
        shell: pwsh
        run: ./.github/scripts/notas-da-release.ps1 -Versao $env:TAG -Sha256 dist/SHA256SUMS.md -Saida dist/NOTAS.md

      - name: Publicar a release
        uses: softprops/action-gh-release@v3
        with:
          name: Sistemas Lineares ${{ github.ref_name }}
          body_path: dist/NOTAS.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/SistemasLineares-Windows.exe
            dist/SistemasLineares-Linux
            dist/SistemasLineares-Navegador.html
            dist/SHA256SUMS.txt
