name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Testar e compilar
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Ler a toolchain fixada
        id: toolchain
        shell: pwsh
        run: ./.github/scripts/toolchain.ps1

      - name: Instalar o Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.canal }}
          components: rustfmt, clippy

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: release

      - name: Instalar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Conferir o compilador C# do .NET Framework
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) {
            throw "csc.exe não encontrado em ${csc}: a paridade com a versão C# não seria verificada."
          }
          Write-Output "Compilador C#: $csc"

      - name: Conferir o Cargo.lock
        working-directory: native
        run: cargo fetch --locked

      - name: Testes, paridade e versão HTML
        shell: cmd
        run: call .\testar-tudo.cmd --no-pause

      - name: Compilar o SistemasLineares.exe
        working-directory: native
        run: cargo build --release --locked

      - name: Calcular o SHA-256
        shell: pwsh
        run: ./.github/scripts/sha256.ps1 -Executavel native/target/release/SistemasLineares.exe -Html SistemasLineares.html

      - name: Enviar os arquivos
        uses: actions/upload-artifact@v6
        with:
          name: sistemas-lineares-windows
          path: |
            native/target/dist/SistemasLineares-Windows.exe
            native/target/dist/SistemasLineares-Navegador.html
            native/target/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Testar e compilar no Linux
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Ler a toolchain fixada
        id: toolchain
        shell: pwsh
        run: ./.github/scripts/toolchain.ps1

      - name: Instalar o Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.canal }}

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: linux

      - name: Instalar o Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Conferir o Cargo.lock
        working-directory: native
        run: cargo fetch --locked

      - name: Testes do núcleo, do modelo e do app Linux
        working-directory: native
        run: xvfb-run -a cargo test --release --locked -p sistemas-lineares-core -p sistemas-lineares-ui -p sistemas-lineares-linux

      - name: Compilar o sistemas-lineares
        working-directory: native
        run: cargo build --release --locked -p sistemas-lineares-linux

      - name: Calcular o SHA-256
        run: |
          mkdir -p native/target/dist
          cp native/target/release/sistemas-lineares native/target/dist/SistemasLineares-Linux
          cd native/target/dist
          sha256sum SistemasLineares-Linux > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          echo "::notice title=SHA-256 SistemasLineares-Linux::$(cut -d' ' -f1 SHA256SUMS-linux.txt)"

      - name: Enviar os arquivos
        uses: actions/upload-artifact@v6
        with:
          name: sistemas-lineares-linux
          path: |
            native/target/dist/SistemasLineares-Linux
            native/target/dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 7